<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/uistyles.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
</div>
<form id="resetRequestForm" method="post">
    <h3>Reset Password</h3>
    <label for="email"></label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <button type="submit">Send Reset Link</button>
    <p>Remember your password? <a href="/login">Login here</a></p>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('resetRequestForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value.trim();

            if (!email) {
                Swal.fire({
                    icon: 'error',
                    title: 'Missing Email',
                    text: 'Please enter your email.'
                });
                return;
            }

            // Send request to reset password
            fetch('/api/passwordresetrequest', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `email=${encodeURIComponent(email)}`
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        Swal.fire({
                            icon: 'success',
                            title: 'Success',
                            text: data.message
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: data.message || "Error occurred. Please try again."
                        });
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Server Error',
                        text: 'A server error occurred. Please try again later.'
                    });
                });
        });
    });
</script>
</body>
</html>
